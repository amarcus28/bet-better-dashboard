<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bet Better Dashboard</title>
    <meta
      name="description"
      content="Bet Better placed-bet results: profit, stake, and ROI by league, market, and book."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,560;8..60,680&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=16" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101410'/%3E%3Cg fill='%23e4c36a' fill-rule='evenodd'%3E%3Cpath transform='translate(2.83 9)' d='M0 14V0h3.3c2.5 0 4 1.35 4 3.35 0 1.45-.85 2.55-2.15 3.05 1.55.45 2.5 1.6 2.5 3.2C7.65 12.2 6.05 14 3.45 14H0zm2.15-8.15h1.2c1.15 0 1.8-.55 1.8-1.4S4.5 3 3.35 3h-1.2zm0 6.15h1.35c1.25 0 1.95-.6 1.95-1.55S4.75 9 3.5 9H2.15z'/%3E%3Cpath transform='translate(12.18 9)' d='M0 14V0h3.3c2.5 0 4 1.35 4 3.35 0 1.45-.85 2.55-2.15 3.05 1.55.45 2.5 1.6 2.5 3.2C7.65 12.2 6.05 14 3.45 14H0zm2.15-8.15h1.2c1.15 0 1.8-.55 1.8-1.4S4.5 3 3.35 3h-1.2zm0 6.15h1.35c1.25 0 1.95-.6 1.95-1.55S4.75 9 3.5 9H2.15z'/%3E%3Cpath transform='translate(21.53 9)' d='M0 14V0h3.3c2.5 0 4 1.35 4 3.35 0 1.45-.85 2.55-2.15 3.05 1.55.45 2.5 1.6 2.5 3.2C7.65 12.2 6.05 14 3.45 14H0zm2.15-8.15h1.2c1.15 0 1.8-.55 1.8-1.4S4.5 3 3.35 3h-1.2zm0 6.15h1.35c1.25 0 1.95-.6 1.95-1.55S4.75 9 3.5 9H2.15z'/%3E%3C/g%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="page">
      <header class="top">
        <h1>Bet Better Dashboard</h1>
        <p class="snapshot" id="snapshot">Loading bets…</p>
      </header>

      <p class="banner" id="banner" hidden></p>

      <section class="filters" aria-label="Filter results">
        <div class="books" id="books"></div>
        <div class="filter-row">
          <label>
            League
            <select id="league">
              <option value="">All leagues</option>
            </select>
          </label>
          <label class="grow">
            Market
            <input id="market" type="search" placeholder="Moneyline, points, spread…" autocomplete="off" />
          </label>
          <label>
            From
            <input id="from" type="date" />
          </label>
          <label>
            To
            <input id="to" type="date" />
          </label>
          <label class="check">
            <input id="settled" type="checkbox" />
            Settled only
          </label>
          <button type="button" class="text-button" id="clear">Clear</button>
        </div>
      </section>

      <section class="kpis" id="kpis" aria-label="Totals"></section>

      <section class="panel">
        <div class="panel-head">
          <h2>Cumulative profit</h2>
          <p id="chart-readout" class="readout"></p>
        </div>
        <canvas id="pnl-chart" aria-label="Cumulative profit over time. Drag to select a date range."></canvas>
      </section>

      <section class="panel" id="breakdown">
        <div class="panel-head">
          <div class="views" id="views" role="tablist" aria-label="Breakdown">
            <a href="#leagues" role="tab" data-view="league" aria-selected="true">Leagues</a>
            <a href="#markets" role="tab" data-view="market" aria-selected="false">Markets</a>
            <a href="#months" role="tab" data-view="month" aria-selected="false">Months</a>
          </div>
          <p class="readout" id="table-meta"></p>
        </div>
        <div id="table-root"></div>
      </section>

      <section class="panel" id="bets">
        <div class="panel-head">
          <h2>Bets</h2>
          <div class="panel-head-end">
            <label class="bets-status" id="bets-status">
              <span>Settled</span>
              <input id="bets-open" type="checkbox" role="switch" aria-label="Show open bets" />
              <span>Open</span>
            </label>
            <p class="readout" id="bets-meta"></p>
          </div>
        </div>
        <div id="bets-root"></div>
      </section>

      <section class="panel" id="bovada-panel">
        <div class="panel-head">
          <h2>Bovada</h2>
          <p class="readout">Picks logged apart from the exchange books.</p>
        </div>
        <div class="kpis bovada-kpis" id="bovada-kpis"></div>
        <div id="bovada-root"></div>
      </section>

      <footer class="foot">
        <p>
          Live results from Supabase, published from
          <a href="https://github.com/amarcus28/bet-better-dashboard">amarcus28/bet-better-dashboard</a>.
          Order ids stay out of this page.
        </p>
      </footer>
    </div>
    <script src="./app.js?v=22"></script>
  </body>
</html>
